[wokwi]
version = 1

# Merged flash image (bootloader + partition table + application), generated by
# scripts/sim-wokwi-prepare.sh with `espflash save-image --merge`.
firmware = "libreroaster.bin"

# ELF with symbols, used by the Wokwi debugger and for readable stack traces.
elf = "libreroaster.elf"

# Optional waveform dump of the simulated pins. Large; ignored by git.
vcdFile = "libreroaster.vcd"

[[chip]]
name = "max31856"
binary = "chips/max31856.chip.wasm"
json = "chips/max31856.chip.json"
