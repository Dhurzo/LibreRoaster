name: 'F2 over-temperature negative latch'
version: 1
author: 'LibreRoaster'

steps:
  - wait-serial: 'Loaded app from partition'
  - delay: 6000ms

  # CHAN;0, UNITS;C, READ
  - write-serial: [67, 72, 65, 78, 59, 48, 13, 10]
  - delay: 200ms
  - write-serial: [85, 78, 73, 84, 83, 59, 67, 13, 10]
  - delay: 200ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 1000ms

  # BT above OVERTEMP_THRESHOLD (260 C). The next control-loop sample must
  # latch the emergency regardless of heater state.
  - set-control:
      part-id: bt
      name: temperature
      value: 270
  - delay: 4000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 1000ms
