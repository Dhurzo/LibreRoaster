name: 'F2 heat-sense negative latch'
version: 1
author: 'LibreRoaster'

steps:
  - wait-serial: 'Loaded app from partition'
  - delay: 6000ms

  # CHAN;0, UNITS;C, READ. The GPIO1 switch stays RIGHT (no current).
  - write-serial: [67, 72, 65, 78, 59, 48, 13, 10]
  - delay: 200ms
  - write-serial: [85, 78, 73, 84, 83, 59, 67, 13, 10]
  - delay: 200ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 1000ms

  # OT1;100. With the switch RIGHT there is no current feedback, so the
  # heat-sense state machine must disable the SSR after ~1.5 s.
  - write-serial: [79, 84, 49, 59, 49, 48, 48, 13, 10]
  - delay: 2000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 2000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 1000ms
