name: 'F1 simulated-sensor smoke'
version: 1
author: 'LibreRoaster'

steps:
  - wait-serial: 'Loaded app from partition'
  - delay: 6000ms

  # CHAN;0, UNITS;C, READ
  - write-serial: [67, 72, 65, 78, 59, 48, 13, 10]
  - delay: 200ms
  - write-serial: [85, 78, 73, 84, 83, 59, 67, 13, 10]
  - delay: 200ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 800ms

  # PREHEAT 200; heater/fan telemetry must show the 20 % fan floor.
  - write-serial: [80, 82, 69, 72, 69, 65, 84, 32, 50, 48, 48, 13, 10]
  - delay: 4000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 4000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - wait-serial: '100.0,20.0,200.0'

  # PID;OFF
  - write-serial: [80, 73, 68, 59, 79, 70, 70, 13, 10]
  - delay: 1000ms
