name: 'F1 RoR negative latch'
version: 1
author: 'LibreRoaster'

steps:
  - wait-serial: 'Loaded app from partition'
  - delay: 6000ms

  # CHAN;0, UNITS;C, READ
  - write-serial: [67, 72, 65, 78, 59, 48, 13, 10]
  - delay: 200ms
  - write-serial: [85, 78, 73, 84, 83, 59, 67, 13, 10]
  - delay: 200ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 500ms

  # START on the default medium curve. Its early slope is well above the
  # 0.75 C/s guard, so the firmware must latch the RoR guard.
  - write-serial: [83, 84, 65, 82, 84, 13, 10]

  # Keepalive so comms-idle cannot race the RoR latch.
  - delay: 4000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 4000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 4000ms
