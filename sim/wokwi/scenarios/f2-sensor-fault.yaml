name: 'F2 sensor-fault negative latch'
version: 1
author: 'LibreRoaster'

steps:
  - wait-serial: 'Loaded app from partition'
  - delay: 6000ms

  # CHAN;0, UNITS;C, READ
  - write-serial: [67, 72, 65, 78, 59, 48, 13, 10]
  - delay: 200ms
  - write-serial: [85, 78, 73, 84, 83, 59, 67, 13, 10]
  - delay: 200ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 1000ms

  # MAX31856 status bit 0 = thermocouple open circuit. BT is the default PV,
  # so the debounced NaN must trip the sensor-fault emergency.
  - set-control:
      part-id: bt
      name: fault
      value: 1
  - delay: 4000ms
  - write-serial: [82, 69, 65, 68, 13, 10]
  - delay: 1000ms
