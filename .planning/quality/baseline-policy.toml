# Quality Baseline Policy
# Deterministic gate execution contract for LibreRoaster v5.0 quality gates

[policy]
# Unique identifier for this quality policy
policy_id = "QG-POLICY"
# Semantic version for ratchet governance
policy_version = "1.0.0"

# Gate execution order - must run in this exact sequence
# Each gate must pass before proceeding to the next
gate_order = ["fmt", "clippy", "test"]

[output]
# Compact output mode for baseline runs
output_mode = "compact"
# Report ALL failures, not just the first one
collect_all_failures = true

[gates.fmt]
# Formatting gate - rustfmt check
command = "cargo fmt --all -- --check"
description = "Code formatting validation"
# Lockfile enforcement for deterministic runs
lockfile_policy = "locked"

[gates.clippy]
# Linting gate - curated clippy checks
# Note: Using curated flags rather than -D warnings to allow tiered enforcement
command = "cargo clippy --locked --all-targets -- -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic"
description = "Linting with embedded-specific rules"
lockfile_policy = "locked"

[gates.test]
# Test gate - unit and integration tests only
# Note: Explicit scope avoids embedded-only targets that fail on host
command = "cargo test --locked --lib --tests --no-fail-fast"
description = "Unit and integration test execution"
lockfile_policy = "locked"

# Test scope: host-safe only (--lib --tests, not --all-targets)
# This excludes doctests and embedded binary compilation
[gate_settings.test]
scope = "lib_and_tests"
doctests = false
all_features = false

# Ratchet governance rules
[ratchet]
# Every ratchet update requires both:
# 1. Policy version bump (semver)
# 2. Human-readable changelog entry
version_bump_required = true
changelog_entry_required = true

# Cadence: ratchet changes should be batched and applied together
# Recommended: Review and apply ratchets at phase boundaries
