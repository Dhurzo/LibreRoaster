<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreRoaster Wiring Diagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      color: #f8fafc;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .diagram-container {
      width: 100%;
      max-width: 1000px;
      background: #1e293b;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .diagram-container img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .btn.secondary {
      background: #475569;
    }
    .btn.secondary:hover {
      background: #64748b;
    }
  </style>
</head>
<body>
  <h1>LibreRoaster Wiring Diagram</h1>
  <p class="subtitle">ESP32-C3 DevKit V1 | v5.1</p>
  
  <div class="diagram-container">
    <img src="libreroaster_wiring.svg" alt="LibreRoaster Wiring Diagram">
  </div>
  
  <div class="actions">
    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
    <button class="btn secondary" onclick="downloadSVG()">Download SVG</button>
  </div>
  
  <script>
    function downloadSVG() {
      fetch('libreroaster_wiring.svg')
        .then(response => response.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'libreroaster_wiring.svg';
          a.click();
          URL.revokeObjectURL(url);
        });
    }
  </script>
</body>
</html>
