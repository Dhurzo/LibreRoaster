<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" font-family="Helvetica,Arial,sans-serif">
  <defs><style>
    .box{stroke:#333;stroke-width:1.5;}
    .chip{fill:#2b2b3a;stroke:#000;stroke-width:2;}
    .t{fill:#111;font-size:14px;font-weight:bold;} .tw{fill:#fff;font-size:14px;font-weight:bold;}
    .p{fill:#111;font-size:12px;} .pw{fill:#fff;font-size:12px;}
    .n{fill:#444;font-size:11px;} .w{fill:#b00;font-size:11.5px;font-weight:bold;}
    .wire{stroke-width:2.6;fill:none;}
    .danger{fill:#fde8e8;stroke:#c0392b;stroke-width:3;stroke-dasharray:7 4;}
  </style></defs>
  <rect width="1040" height="760" fill="#f7f7f9"/>
  <text x="520" y="30" text-anchor="middle" class="t" font-size="18">Subsystem 3 — SSR + HEATER (heat control) — ⚠ AC MAINS</text>
  <text x="520" y="50" text-anchor="middle" class="n">GPIO10 · LEDC Ch1 / Timer0 · 1 Hz (SSR_CONTROL_CYCLE_HZ=1) zero-cross · detection via GPIO1</text>

  <!-- ============ LOW VOLTAGE CONTROL SIDE ============ -->
  <rect x="40" y="90" width="170" height="150" rx="8" class="chip"/>
  <text x="125" y="116" text-anchor="middle" class="tw">ESP32-C3</text>
  <circle cx="210" cy="150" r="4" fill="#D32F2F"/><text x="150" y="154" text-anchor="end" class="pw">GPIO10</text>
  <circle cx="210" cy="186" r="4" fill="#795548"/><text x="150" y="190" text-anchor="end" class="pw">GPIO1</text>
  <circle cx="210" cy="222" r="4" fill="#bbb"/><text x="150" y="226" text-anchor="end" class="pw">GND</text>

  <!-- optional transistor buffer note -->
  <rect x="270" y="120" width="180" height="120" rx="6" fill="#eef" class="box"/>
  <text x="360" y="142" text-anchor="middle" class="t" font-size="12">SSR control</text>
  <text x="280" y="164" class="n">GPIO10 → DC+ (3–32 Vdc)</text>
  <text x="280" y="182" class="n">GND   → DC−</text>
  <text x="280" y="204" class="w">⚠ 3.3 V may be marginal</text>
  <text x="280" y="220" class="n">if the SSR needs &gt;3 V / &gt;15 mA:</text>
  <text x="280" y="234" class="n">transistor buffer from 5/12 V</text>
  <line x1="210" y1="150" x2="270" y2="150" class="wire" stroke="#D32F2F"/>
  <line x1="210" y1="222" x2="252" y2="222" class="wire" stroke="#999"/>
  <line x1="252" y1="222" x2="252" y2="182" class="wire" stroke="#999"/>

  <!-- ============ DANGER AC ZONE ============ -->
  <rect x="500" y="80" width="510" height="330" rx="10" class="danger"/>
  <text x="755" y="104" text-anchor="middle" class="w" font-size="14">⚠ AC MAINS ZONE — 110–240 V — PHYSICALLY ISOLATE — DISCONNECT TO WIRE</text>

  <!-- SSR -->
  <rect x="520" y="130" width="190" height="170" rx="6" fill="#fff" class="box"/>
  <text x="615" y="152" text-anchor="middle" class="t" font-size="13">SSR (zero-cross)</text>
  <text x="615" y="169" text-anchor="middle" class="n">+ HEATSINK (≈1 W/A)</text>
  <text x="532" y="194" class="p">1 · DC+  ← GPIO10</text>
  <text x="532" y="214" class="p">2 · DC−  ← GND</text>
  <text x="532" y="240" class="p">3 · AC-IN  ← L (fuse)</text>
  <text x="532" y="260" class="p">4 · AC-OUT → heater</text>
  <text x="532" y="286" class="w">✅ 1 Hz zero-cross compatible</text>
  <line x1="450" y1="150" x2="520" y2="190" class="wire" stroke="#D32F2F"/>
  <line x1="252" y1="222" x2="252" y2="300" class="wire" stroke="#999"/>
  <polyline class="wire" stroke="#999" points="252,300 470,300 470,210 520,210"/>

  <!-- Fuse + L -->
  <rect x="740" y="120" width="120" height="40" rx="4" fill="#fff" class="box"/>
  <text x="800" y="138" text-anchor="middle" class="p">AC fuse</text>
  <text x="800" y="153" text-anchor="middle" class="n">+ terminal block</text>
  <text x="900" y="135" class="p">L (Live)</text>
  <line x1="860" y1="140" x2="895" y2="140" class="wire" stroke="#c0392b"/>
  <line x1="740" y1="140" x2="710" y2="140" class="wire" stroke="#c0392b"/>
  <polyline class="wire" stroke="#c0392b" points="710,140 700,140 700,236 710,236"/>
  <text x="690" y="232" text-anchor="end" class="n">AC-IN</text>

  <!-- thermal cutoff in series -->
  <rect x="740" y="180" width="150" height="44" rx="4" fill="#e8f5e9" class="box"/>
  <text x="815" y="200" text-anchor="middle" class="p">HW thermal cutoff</text>
  <text x="815" y="216" text-anchor="middle" class="w">klixon/thermal fuse (in series)</text>

  <!-- Heater -->
  <rect x="740" y="250" width="240" height="120" rx="6" fill="#fff" class="box"/>
  <text x="860" y="272" text-anchor="middle" class="t" font-size="13">Heating element</text>
  <text x="860" y="290" text-anchor="middle" class="n">800–2000 W · 110–240 V</text>
  <text x="752" y="314" class="p">L ← SSR AC-OUT (via thermal cutoff)</text>
  <text x="752" y="334" class="p">N ← mains neutral</text>
  <text x="752" y="356" class="w">PE → metal chassis (MANDATORY)</text>
  <polyline class="wire" stroke="#c0392b" points="710,255 730,255 730,202 740,202"/>
  <text x="690" y="258" text-anchor="end" class="n">AC-OUT</text>
  <polyline class="wire" stroke="#c0392b" points="890,202 905,202 905,250"/>

  <!-- ============ HEAT DETECTION ============ -->
  <rect x="40" y="450" width="430" height="180" rx="6" fill="#efe7e1" class="box"/>
  <text x="255" y="472" text-anchor="middle" class="t" font-size="13">Heat detection → GPIO1</text>
  <text x="54" y="496" class="n">Current sensor (CT/clamp) on the heater's L line</text>
  <text x="54" y="514" class="n">  → burden resistor → rectifier/comparator</text>
  <text x="54" y="532" class="n">  → OPEN-COLLECTOR output → GPIO1</text>
  <text x="54" y="554" class="p">GPIO1: internal pull-up · LOW = current flowing (heater ON)</text>
  <text x="54" y="576" class="w">⚠ GPIO1 NEVER touches the mains. The SSR-25DA has NO feedback pin;</text>
  <text x="54" y="592" class="w">   the signal comes from YOUR sensing circuit, not the SSR.</text>
  <text x="54" y="614" class="n">Alternative: optocoupler across the SSR output (open-collector).</text>
  <line x1="210" y1="186" x2="240" y2="186" class="wire" stroke="#795548"/>
  <polyline class="wire" stroke="#795548" points="240,186 240,450"/>
  <text x="248" y="320" class="n">GPIO1</text>

  <!-- ============ NOTES / WARNINGS ============ -->
  <rect x="500" y="450" width="510" height="240" rx="6" fill="#fff" class="box"/>
  <text x="514" y="472" class="t" font-size="13">Safety and critical notes</text>
  <text x="514" y="494" class="n">• The SSR switches the live (L), not neutral. Fuse + terminal block on the AC input.</text>
  <text x="514" y="512" class="w">• ✅ 1 Hz time-proportioning control — compatible with zero-cross SSRs (SSR-25DA, etc.)</text>
  <text x="514" y="566" class="w">• HW thermal cutoff (klixon/thermal fuse) in SERIES with the heater,</text>
  <text x="514" y="582" class="w">   independent of the CPU (mitigates audit findings THERM-1/THERM-2).</text>
  <text x="514" y="604" class="n">• Heatsink on the SSR (≈1 W per A). At 10 A it dissipates ~10–15 W.</text>
  <text x="514" y="622" class="n">• If 3.3 V SSR control is marginal, buffer with a transistor from 5/12 V.</text>
  <text x="514" y="644" class="n">• Verify control in SAFE mode (0% duty): cargo run --release --example hil_ssr</text>
  <text x="514" y="662" class="n">• Verify detection: cargo run --release --example hil_gpio (reads GPIO1)</text>
  <text x="514" y="682" class="w">• NEVER leave the roaster unattended. Keep an extinguisher nearby when testing.</text>

  <text x="520" y="730" text-anchor="middle" class="n">LibreRoaster · SSR+heater subsystem · GPIO10 (SSR_CONTROL_PIN=10) · GPIO1 (HEAT_DETECTION_PIN=1) · ⚠ AC mains</text>
  <text x="520" y="748" text-anchor="middle" class="w">Connect the AC side ONLY at the end, with everything else verified and the mains disconnected.</text>
</svg>
