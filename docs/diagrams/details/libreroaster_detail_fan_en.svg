<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" font-family="Helvetica,Arial,sans-serif">
<defs><style>
.box{stroke:#333;stroke-width:1.5;rx:8;} .chip{fill:#2b2b3a;stroke:#000;stroke-width:2;}
.t{fill:#111;font-size:14px;font-weight:bold;} .tw{fill:#fff;font-size:13px;font-weight:bold;}
.p{fill:#111;font-size:11px;} .pw{fill:#fff;font-size:11px;} .n{fill:#444;font-size:10.5px;}
.w{fill:#b00;font-size:11px;font-weight:bold;} .wire{stroke-width:2.6;fill:none;} .res{fill:#fff;stroke:#92400e;stroke-width:1.6;}
</style></defs>
<rect width="1200" height="950" fill="#f7f7f9"/>
<text x="600" y="28" text-anchor="middle" class="t" font-size="20">LibreRoaster — Detail: Fan Stage (GPIO9 · 25 kHz · MOSFET Low-Side)</text>
<text x="600" y="48" text-anchor="middle" class="n">LEDC Ch0 / Timer1 · 25 kHz 8-bit · GPIO9 strapping pin · Verified FanController with_handle + init.rs:152-163</text>

<!-- Top: waveform -->
<rect x="40" y="70" width="1120" height="130" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
<text x="60" y="92" class="t">PWM Waveform 25 kHz (period 40 µs) — Above Audible, No Whine</text>
<text x="60" y="112" class="n">25,000 Hz · 8-bit → 256 steps · Duty 0–100% via percentage_to_duty() · FADE_THRESHOLD 12 ticks (~4.7%) — below threshold direct write, above fade 4×delta+80ms</text>
<!-- 25% -->
<text x="60" y="136" class="n" font-weight="bold">25%:</text><polyline points="120,150 180,150 180,130 200,130 200,150 220,150" fill="none" stroke="#FF5722" stroke-width="2.5"/>
<text x="230" y="152" class="n">ON 10µs / OFF 30µs</text>
<!-- 50% -->
<text x="340" y="136" class="n" font-weight="bold">50%:</text><polyline points="380,150 420,150 420,130 460,130 460,150 480,150" fill="none" stroke="#FF5722" stroke-width="2.5"/>
<text x="490" y="152" class="n">20/20µs</text>
<!-- 75% -->
<text x="560" y="136" class="n" font-weight="bold">75%:</text><polyline points="600,150 640,150 640,130 680,130 680,150 700,150" fill="none" stroke="#FF5722" stroke-width="2.5"/>
<text x="710" y="152" class="n">30/10µs</text>
<text x="820" y="136" class="n">Scope: probe at MOSFET gate (via 1k). Expect 3.3V swing, rise &lt;100ns with 1k series.</text>
<text x="60" y="176" class="n">FAN_MIN_SAFETY_PCT 20% enforced when heater energized — OT2 0 with heat on is overridden (see actuator.rs).</text>

<!-- Central wiring ultra detailed -->
<rect x="40" y="220" width="700" height="360" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
<text x="390" y="242" text-anchor="middle" class="t">Wiring — Component-Level (Build This Exactly)</text>

<!-- ESP -->
<rect x="60" y="260" width="120" height="60" rx="6" class="chip"/><text x="120" y="284" text-anchor="middle" class="tw">GPIO9</text><text x="120" y="300" text-anchor="middle" class="pw" font-size="9">LEDC 25kHz</text>
<circle cx="180" cy="280" r="4" fill="#FF5722"/>
<!-- 10k pull-up on GPIO9 side -->
<line x1="150" y1="280" x2="150" y2="240" class="wire" stroke="#E53935"/>
<rect x="135" y="244" width="30" height="18" rx="3" class="res"/><text x="150" y="257" text-anchor="middle" class="n" font-size="9">10k</text>
<line x1="150" y1="244" x2="150" y2="230" class="wire" stroke="#E53935"/><line x1="150" y1="230" x2="520" y2="230" class="wire" stroke="#E53935"/><text x="540" y="234" class="p">3.3V</text>
<text x="200" y="236" class="w" font-size="9">mandatory on custom PCB</text>
<!-- 1k series -->
<rect x="210" y="270" width="56" height="20" rx="3" class="res"/><text x="238" y="284" text-anchor="middle" class="n">1 kΩ</text>
<line x1="180" y1="280" x2="210" y2="280" class="wire" stroke="#FF5722"/>
<line x1="266" y1="280" x2="310" y2="280" class="wire" stroke="#FF5722"/>

<!-- Gate node -->
<rect x="310" y="250" width="140" height="110" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="380" y="270" text-anchor="middle" class="t" font-size="11">MOSFET IRLZ44N</text>
<text x="320" y="290" class="n">G ← 1kΩ (gate stopper, &lt;40mA)</text>
<text x="320" y="308" class="n">D → Fan − (low-side)</text>
<text x="320" y="326" class="n">S → GND (star)</text>
<text x="320" y="344" class="n">Vgs(th) 1–2V ✔ 3.3V drive</text>

<!-- 100k weak gate→GND -->
<line x1="360" y1="280" x2="360" y2="420" class="wire" stroke="#999"/>
<rect x="345" y="330" width="30" height="18" rx="3" class="res"/><text x="360" y="343" text-anchor="middle" class="n" font-size="9">100k</text>
<text x="400" y="344" class="n">weak, separated by 1k</text>
<line x1="360" y1="348" x2="360" y2="440" class="wire" stroke="#999"/>
<text x="320" y="456" class="n">Common GND star</text>

<!-- Optional Zener G-S 3.6V (logic-level clamp; see pinout.md) -->
<line x1="380" y1="310" x2="500" y2="310" class="wire" stroke="#7c3aed" stroke-dasharray="5 3"/>
<rect x="500" y="298" width="60" height="24" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="530" y="314" text-anchor="middle" class="n" font-size="9">3.6V Zener</text>
<text x="565" y="314" class="n">optional G–S clamp (3.3V logic)</text>

<!-- Fan + flyback -->
<rect x="520" y="260" width="140" height="80" rx="6" fill="#fff3e0" stroke="#333" stroke-width="1.5"/>
<text x="590" y="284" text-anchor="middle" class="t" font-size="11">DC Fan 12V M</text>
<text x="590" y="302" text-anchor="middle" class="n">(+) ← 12V always</text>
<text x="590" y="320" text-anchor="middle" class="n">(−) → D (switched)</text>
<line x1="590" y1="340" x2="590" y2="380" class="wire" stroke="#333"/>
<!-- Flyback -->
<rect x="520" y="380" width="140" height="34" rx="4" fill="#eef" stroke="#333" stroke-width="1.2"/>
<text x="590" y="402" text-anchor="middle" class="w">1N4007 Flyback</text>
<text x="590" y="418" text-anchor="middle" class="n">cathode → +12V · anode → D</text>
<line x1="590" y1="352" x2="590" y2="380" class="wire" stroke="#FF5722"/>
<line x1="590" y1="414" x2="590" y2="434" class="wire" stroke="#333" stroke-width="2"/>

<!-- 12V supply -->
<rect x="520" y="450" width="140" height="60" rx="6" fill="#fbe9e7" stroke="#333" stroke-width="1.5"/>
<text x="590" y="472" text-anchor="middle" class="t" font-size="11">12V ≥5A</text>
<text x="590" y="490" text-anchor="middle" class="n">+ → Fan(+)</text>
<text x="590" y="506" class="n">GND → star</text>
<line x1="590" y1="464" x2="590" y2="450" class="wire" stroke="#FF5722"/>
<line x1="590" y1="510" x2="400" y2="510" class="wire" stroke="#999"/>

<!-- Right panel specs -->
<rect x="780" y="220" width="380" height="360" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="970" y="242" text-anchor="middle" class="t">Why These Values? (from pinout.md:256-272)</text>
<text x="800" y="262" class="n">• <tspan font-weight="bold">10k pull-up</tspan> → 3.3V: keeps GPIO9 HIGH at reset (boot:0xc). With 100k weak alone, external driver could still pull LOW.</text>
<text x="800" y="282" class="n">• <tspan font-weight="bold">100k weak</tspan>: holds gate LOW (fan OFF) when ESP Hi-Z, but divider 10k/110k → 3.0V &gt; 2.5V threshold (boot OK).</text>
<text x="800" y="302" class="n">  If 10k/10k → 1.65V boot FAIL (see resistor detail diagram).</text>
<text x="800" y="322" class="n">• <tspan font-weight="bold">1k series</tspan>: limits GPIO current to &lt;3.3mA into gate capacitance, prevents &gt;40mA spike.</text>
<text x="800" y="342" class="n">• <tspan font-weight="bold">Flyback mandatory</tspan>: motor L → &gt;20V spike → latch-up → chip cracks. Place &lt;20mm from fan.</text>
<text x="800" y="362" class="n">• <tspan font-weight="bold">IRLZ44N not IRF520</tspan>: IRF520 Vgs(th) 2–4V needs 5V gate, will not saturate at 3.3V → hot, slow.</text>
<text x="800" y="382" class="n">• Star GND: ESP GND + MOSFET S + 12V GND + MAX GND + UART GND at ONE point.</text>
<rect x="800" y="400" width="340" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="810" y="420" class="t" font-size="11">Test Procedure (hil_fan)</text>
<text x="810" y="438" class="n">cargo run --example hil_fan → sweeps 0/25/50/75/100/0% readback</text>
<text x="810" y="456" class="n">Scope GPIO9: 25kHz 3.3V, duty matches. DMM gate: 0V at boot (Hi-Z), 3.0V HIGH.</text>
<text x="810" y="474" class="n">DMM 3.3V rail: 3.135–3.465V. Never exceed 3.6V on GPIO.</text>
<text x="800" y="484" class="w">No fan briefly at boot = harmless. Heater OFF at boot = critical.</text>
<rect x="800" y="498" width="340" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="810" y="518" class="t" font-size="11">Spec Ref</text>
<text x="810" y="536" class="n">FAN_PWM_FREQUENCY_HZ=25000, FAN_PWM_RESOLUTION=8, FAN_LEDC_CHANNEL=0</text>
<text x="810" y="554" class="n">FAN_MIN_SAFETY_PCT=20, FADE_THRESHOLD 12 ticks</text>

<!-- Footer -->
<rect x="40" y="610" width="1120" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="60" y="632" class="t">Assembly Notes — Common Failures</text>
<text x="60" y="652" class="n">• Fan spins briefly at boot: EXPECTED (GPIO9 weak pull-up moment). Heater must NOT energize — verified by GPIO1 HIGH (no heat) at duty 0.</text>
<text x="60" y="670" class="n">• Whine at 1kHz: you used wrong timer (1kHz) — must be 25kHz. Check init.rs:134-146.</text>
<text x="60" y="688" class="n">• Boot loops to download: 10k/10k divider or MOSFET gate tied directly to GPIO9 without 1k → fix resistor network.</text>

<text x="600" y="940" text-anchor="middle" class="n" font-size="10">LibreRoaster · Fan Stage Detail · CC BY-SA · printable 1200×950 · v0.1</text>
</svg>