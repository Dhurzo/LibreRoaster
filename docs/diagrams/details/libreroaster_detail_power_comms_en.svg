<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" font-family="Helvetica,Arial,sans-serif">
<defs><style>
.box{stroke:#333;stroke-width:1.5;rx:8;} .chip{fill:#2b2b3a;stroke:#000;stroke-width:2;}
.t{fill:#111;font-size:14px;font-weight:bold;} .tw{fill:#fff;font-size:13px;font-weight:bold;}
.p{fill:#111;font-size:11px;} .pw{fill:#fff;font-size:11px;} .n{fill:#444;font-size:10.5px;}
.w{fill:#b00;font-size:11px;font-weight:bold;} .wire{stroke-width:2.5;fill:none;}
</style></defs>
<rect width="1200" height="950" fill="#f7f7f9"/>
<text x="600" y="28" text-anchor="middle" class="t" font-size="20">LibreRoaster — Detail: Power Rails &amp; Communication (UART + Native USB)</text>
<text x="600" y="48" text-anchor="middle" class="n">3.3V logic ±5% · 12V fan · 5V USB · Star GND · UART0 GPIO20/21 115200 8N1 · USB-C CDC primary · src/hardware/init.rs + wiring-diagram.svg</text>

<!-- Left: 3.3V logic -->
<rect x="40" y="70" width="540" height="200" rx="10" fill="#fff" stroke="#E53935" stroke-width="2"/>
<text x="310" y="92" text-anchor="middle" class="t">3.3V Logic Rail — Powers ESP, MAX×2, SSR Logic, Sense</text>
<rect x="60" y="110" width="180" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="150" y="132" text-anchor="middle" class="t" font-size="11">5V Source</text><text x="150" y="148" text-anchor="middle" class="n">USB-C or ext 5V</text>
<line x1="240" y1="135" x2="280" y2="135" class="wire" stroke="#E53935"/>
<rect x="280" y="118" width="100" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="330" y="139" text-anchor="middle" class="n">AMS1117-3.3</text><text x="330" y="136" text-anchor="middle" class="n" font-size="8">LDO 1A</text>
<line x1="380" y1="135" x2="420" y2="135" class="wire" stroke="#E53935"/>
<text x="420" y="120" class="w">3.3V ±5% (3.135–3.465V)</text>
<text x="420" y="138" class="n">≥200mA for ESP (≈150mA) + 2×MAX (5mA) + SSR + sense</text>
<text x="420" y="156" class="w">NEVER 5V on 3.3V rail — instant death</text>
<text x="420" y="174" class="n">LDO close to ESP (&lt;20mm), thick traces ≥AWG20</text>
<rect x="60" y="180" width="500" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="70" y="198" class="t" font-size="11">Decoupling — Place &lt;5mm from each IC</text>
<text x="70" y="216" class="n">100µF electrolytic (bulk) + 10µF ceramic (LDO) + 0.1µF ceramic per IC (HF) between 3V3 and GND</text>
<text x="70" y="234" class="n">One 0.1µF for ESP32-C3, one per MAX31856, one for CH341. Star to GND point.</text>

<!-- 12V -->
<rect x="620" y="70" width="540" height="200" rx="10" fill="#fff7ed" stroke="#FF5722" stroke-width="2"/>
<text x="890" y="92" text-anchor="middle" class="t">12V Fan Rail — Separate Supply (5A min)</text>
<rect x="640" y="110" width="140" height="50" rx="6" fill="#fbe9e7" stroke="#333" stroke-width="1.5"/><text x="710" y="132" text-anchor="middle" class="t" font-size="11">12V 5A+ PSU</text><text x="710" y="148" text-anchor="middle" class="n">+ → Fan · GND → star</text>
<line x1="780" y1="135" x2="820" y2="135" class="wire" stroke="#FF5722"/>
<rect x="820" y="118" width="120" height="34" rx="6" fill="#fff3e0" stroke="#333" stroke-width="1.2"/><text x="880" y="139" text-anchor="middle" class="n">DC Fan 12V</text>
<line x1="940" y1="135" x2="980" y2="135" class="wire" stroke="#FF5722"/>
<text x="640" y="180" class="n">12V only for fan + MOSFET driver. NEVER tie to 3.3V rail. Common GND star only.</text>
<text x="640" y="198" class="n">Fuse 5A on +12V. Wire 20AWG+. Fan tach (if present) not used — cap it.</text>
<text x="640" y="216" class="n">12V → fan (+) always, fan (−) switched via MOSFET low-side (see fan detail).</text>
<rect x="640" y="230" width="500" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="650" y="250" class="w" font-size="10"> Leakage path: MOSFET drain-gate short can feed 12V → GPIO9 via 1k → ESD → 3.3V rail. Use flyback + Zener + proper MOSFET.</text>

<!-- Star ground -->
<rect x="40" y="300" width="1120" height="90" rx="10" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
<text x="600" y="322" text-anchor="middle" class="t">STAR GROUND — Single Point, No Loops</text>
<line x1="200" y1="340" x2="600" y2="340" class="wire" stroke="#999" stroke-dasharray="6 3"/>
<text x="120" y="360" class="n">ESP GND</text><text x="260" y="360" class="n">MAX3V3 GND</text><text x="400" y="360" class="n">MAX4V3 GND</text><text x="550" y="360" class="n">MOSFET S</text><text x="680" y="360" class="n">12V GND</text><text x="820" y="360" class="n">UART GND</text><text x="960" y="360" class="n">Sense GND</text>
<circle cx="600" cy="340" r="6" fill="#333"/>
<text x="600" y="382" text-anchor="middle" class="w">AC mains PE/chassis isolated — does NOT share this star. NEVER connect AC N/GND to DC GND.</text>

<!-- USB vs UART -->
<rect x="40" y="420" width="560" height="280" rx="10" fill="#e8f5e9" stroke="#059669" stroke-width="2"/>
<text x="320" y="442" text-anchor="middle" class="t">Communication — Pick ONE at a Time</text>
<!-- Native USB -->
<rect x="60" y="460" width="240" height="80" rx="6" fill="#e3f2fd" stroke="#3949AB" stroke-width="1.5"/>
<text x="180" y="482" text-anchor="middle" class="t" font-size="11">Native USB-C CDC</text>
<text x="70" y="502" class="n">ESP32-C3 USB-Serial/JTAG (internal)</text>
<text x="70" y="520" class="n">/dev/ttyACM0 (Linux) 115200 virtual</text>
<text x="70" y="538" class="w">RECOMMENDED — flashing + Artisan</text>
<line x1="300" y1="500" x2="340" y2="500" class="wire" stroke="#3949AB"/>
<!-- UART -->
<rect x="360" y="460" width="220" height="80" rx="6" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<text x="470" y="482" text-anchor="middle" class="t" font-size="11">USB-UART Adapter</text>
<text x="370" y="502" class="n">FTDI / CH340 / CP2102</text>
<text x="370" y="520" class="n">RX←GPIO21 TX→GPIO20</text>
<text x="370" y="538" class="n">1kΩ series on RX + GND mandatory</text>
<!-- ESP comms pins -->
<rect x="60" y="580" width="240" height="80" rx="6" class="chip"/>
<text x="180" y="604" text-anchor="middle" class="tw">ESP32-C3 Comms</text>
<text x="70" y="624" class="n">GPIO21 TX → adapter RX (direct)</text>
<text x="70" y="642" class="n">GPIO20 RX ← adapter TX — 1kΩ series</text>
<text x="70" y="660" class="w">Adapter VCC selector MUST be 3.3V</text>
<line x1="300" y1="600" x2="360" y2="540" class="wire" stroke="#00897B"/>
<line x1="300" y1="620" x2="360" y2="520" class="wire" stroke="#00ACC1"/>
<rect x="60" y="670" width="520" height="20" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="70" y="684" class="w" font-size="10">Multiplexer: first channel with traffic latches for 60s — UART or USB, not both simultaneously (see ARTISAN_CONNECTION.md)</text>

<!-- Right: warnings + baud -->
<rect x="640" y="420" width="520" height="280" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="900" y="442" text-anchor="middle" class="t">Critical Warnings — Read Before Wiring</text>
<text x="660" y="466" class="w">1. CH341 5V clones KILL GPIOs</text>
<text x="660" y="484" class="n">   Many CH341 boards default 5V. Verify VCC with DMM — set jumper to 3.3V.</text>
<text x="660" y="502" class="n">   5V on GPIO20/21 → &gt;3.6V → instant pad damage. 1kΩ limits but not infinite.</text>
<text x="660" y="522" class="w">2. Back-powering via ESD diode</text>
<text x="660" y="540" class="n">   CH341 TX=3.3V when ESP off → powers VDD via GPIO20 diode → brownout corruption.</text>
<text x="660" y="558" class="n">   Use 10kΩ series or BAT54, or power-sequence: ESP first, then adapter.</text>
<text x="660" y="576" class="w">3. Do NOT tie adapter VCC to 3.3V rail</text>
<text x="660" y="594" class="n">   Adapter 3.3V is an output reference, not a power supply. Only connect GND + TX/RX.</text>
<text x="660" y="612" class="w">4. Baud 115200 8N1 — USB CDC ignores baud, UART requires it</text>
<text x="660" y="630" class="n">   Artisan: Serial port, TC4 protocol, 115200. Test: CHAN;1200 → #1200, READ → temps.</text>
<rect x="660" y="644" width="480" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="664" class="t" font-size="11">If you only do one thing: buy a 3.3V-verified adapter.</text>
<text x="670" y="682" class="n">FTDI FT232R (jumper 3.3V) or CP2102 (3.3V default) are safer than CH340 clones.</text>

<!-- Footer -->
<rect x="40" y="720" width="1120" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="60" y="742" class="t" font-size="12">Bring-Up Order (see wiring-diagrams-images.md)</text>
<text x="60" y="762" class="n">1. Power 3.3V only → verify 3.135–3.465V + boot log “LibreRoaster v0.1”.  2. +Thermocouples → hil_tc reads 25°C ambient.  3. +Fan → hil_fan sweep.  4. +SSR DC only → hil_ssr duty 0.  5. Full + AC last with extinguisher.</text>
<text x="60" y="782" class="n">Native USB flashing: cargo espflash flash --port /dev/ttyACM0 --features embedded. UART fallback: --port /dev/ttyUSB0.</text>

<text x="600" y="940" text-anchor="middle" class="n" font-size="10">LibreRoaster · Power &amp; Comms Detail · CC BY-SA · printable 1200×950 · v0.1</text>
</svg>