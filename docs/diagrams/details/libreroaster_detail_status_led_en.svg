<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" font-family="Helvetica,Arial,sans-serif">
<defs><style>
.box{stroke:#333;stroke-width:1.5;rx:8;} .chip{fill:#2b2b3a;stroke:#000;stroke-width:2;}
.t{fill:#111;font-size:14px;font-weight:bold;} .tw{fill:#fff;font-size:13px;font-weight:bold;}
.p{fill:#111;font-size:11px;} .pw{fill:#fff;font-size:11px;} .n{fill:#444;font-size:10.5px;}
.w{fill:#b00;font-size:11px;font-weight:bold;} .wire{stroke-width:2.5;fill:none;} .res{fill:#fff;stroke:#92400e;stroke-width:1.6;}
</style></defs>
<rect width="1200" height="950" fill="#f7f7f9"/>
<text x="600" y="28" text-anchor="middle" class="t" font-size="20">LibreRoaster — Detail: Status LED (GPIO8) &amp; Safe Shutdown</text>
<text x="600" y="48" text-anchor="middle" class="n">GPIO8 push-pull active-high · NOT strapping for normal SPI-boot · Single owner ServiceContainer · Patterns off/1Hz/Solid/4Hz · src/hardware/status_led.rs:26-48</text>

<!-- Wiring -->
<rect x="40" y="70" width="540" height="220" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="92" text-anchor="middle" class="t">Wiring — GPIO8 → 330 Ω → LED → GND</text>
<rect x="60" y="120" width="100" height="40" rx="6" class="chip"/><text x="110" y="144" text-anchor="middle" class="tw">GPIO8</text>
<line x1="160" y1="140" x2="200" y2="140" class="wire" stroke="#2563eb"/>
<rect x="200" y="128" width="60" height="24" rx="3" class="res"/><text x="230" y="144" text-anchor="middle" class="n">330Ω</text><text x="230" y="156" text-anchor="middle" class="n" font-size="8">±5% 0.125W</text>
<line x1="260" y1="140" x2="300" y2="140" class="wire" stroke="#2563eb"/>
<rect x="300" y="125" width="60" height="30" rx="15" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="330" y="145" text-anchor="middle" class="n">LED</text>
<text x="300" y="116" class="n" font-size="9">Anode (long leg)</text>
<line x1="360" y1="140" x2="390" y2="140" class="wire" stroke="#999"/>
<text x="395" y="144" class="n">GND</text>
<rect x="60" y="170" width="500" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="70" y="188" class="n">Calc: If = (3.3V − Vf)/R. Vf≈2.0V red → (1.3V)/330Ω = 3.9mA. Vf≈3.0V white/blue → (0.3V)/330Ω=0.9mA (dim, use 150Ω for white).</text>
<text x="70" y="206" class="n">Max per GPIO 40mA (rec 20mA). 330Ω is safe for any LED color. Direct drive without R → &gt;50mA → silent pad death over weeks.</text>
<text x="70" y="224" class="n">Push-pull only (DriveMode::PushPull) — never open-drain. External transistor driver must be high-Z at reset (do not pull GPIO8 LOW at boot in download mode combo).</text>
<text x="70" y="242" class="n">GPIO8 HIGH at init (Level::High in init.rs:224) — LED on at boot until control loop takes over.</text>

<!-- Patterns table -->
<rect x="620" y="70" width="540" height="220" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="890" y="92" text-anchor="middle" class="t">Patterns — pattern_for(state, fault) → LedPattern</text>
<rect x="640" y="110" width="500" height="24" rx="4" fill="#1f2937"/><text x="650" y="126" fill="#fff" font-size="11" font-weight="bold">RoasterState → LedPattern → led_on(elapsed_ms)</text>
<text x="650" y="148" class="p"><tspan font-weight="bold">Idle</tspan> → Off → always false</text><text x="850" y="148" class="n">○ off</text>
<text x="650" y="168" class="p"><tspan font-weight="bold">Preheating</tspan> → Blink1Hz → (elapsed%1000)&lt;500</text><text x="970" y="168" class="n">◐ 500ms on/off</text>
<text x="650" y="188" class="p"><tspan font-weight="bold">Heating/Stable</tspan> → Solid → always true</text><text x="970" y="188" class="n">● on</text>
<text x="650" y="208" class="p"><tspan font-weight="bold">Error</tspan> → Blink4Hz → (elapsed%250)&lt;125</text><text x="970" y="208" class="n">◑ 125ms on/off</text>
<text x="650" y="228" class="p"><tspan font-weight="bold">Any fault=true</tspan> → Blink4Hz (overrides state)</text><text x="970" y="228" class="w">⚠ attention</text>
<text x="640" y="252" class="n">Phase-locked to elapsed_ms epoch — no per-task toggle state. Impl in status_led.rs:41-48.</text>
<text x="640" y="270" class="n">Safe-shutdown (init failure): Peripherals::steal() GPIO8 → blink 3×200ms, pause 1s, feed HW WDT, loop forever (main.rs:70-95).</text>

<!-- Timing diagram -->
<rect x="40" y="310" width="1120" height="140" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="60" y="332" class="t">Timing Diagram — LED Logic Level at GPIO8</text>
<!-- 1Hz -->
<text x="60" y="356" class="n" font-weight="bold">1Hz (Preheating):</text>
<polyline points="150,370 250,370 250,350 350,350 350,370 450,370 450,350 550,350 550,370" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="150" y="386" class="n" font-size="9">0ms HIGH</text><text x="250" y="386" class="n" font-size="9">500ms LOW</text><text x="350" y="386" class="n" font-size="9">1000ms HIGH</text>
<text x="600" y="366" class="n">Driven once per control-loop tick (~310ms) via ServiceContainer — not every ms, but phase calc covers it.</text>
<!-- 4Hz -->
<text x="60" y="406" class="n" font-weight="bold">4Hz (Error/Fault):</text>
<polyline points="150,420 200,420 200,400 250,400 250,420 300,420 300,400 350,400 350,420 400,420 400,400 450,400 450,420" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="150" y="436" class="n" font-size="9">125ms on/off — urgent blink, visible vs 1Hz</text>
<text x="600" y="426" class="n">Fault overrides: even if state==Heating but fault==true → 4Hz. Watchdog cut? Still 4Hz.</text>

<!-- Strapping clarification -->
<rect x="40" y="470" width="560" height="140" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="320" y="492" text-anchor="middle" class="t">Strapping Clarification — GPIO8 Is SAFE</text>
<text x="60" y="514" class="n">• Normal SPI-boot mode: GPIO8 <tspan font-weight="bold">ignored</tspan> — LOW cannot stop firmware (HARDWARE.md:121).</text>
<text x="60" y="532" class="n">• Only matters in <tspan font-weight="bold">download mode</tspan>: GPIO8=HIGH + GPIO9=LOW → download; GPIO8=LOW+GPIO9=LOW invalid.</text>
<text x="60" y="550" class="n">• So GPIO8 as status LED is safe. Old docs listed GPIO8 as strap — now fixed (2026-09-06).</text>
<text x="60" y="568" class="n">• Still: use 330Ω, push-pull, ensure no LOW-forcing circuit at boot during download entry.</text>
<text x="60" y="586" class="n">• If driving via transistor, ensure off at power-up (high-Z).</text>

<!-- Safe shutdown flow -->
<rect x="640" y="470" width="520" height="140" rx="10" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="900" y="492" text-anchor="middle" class="t">Safe-Shutdown Path (init failure)</text>
<text x="660" y="514" class="n">init_hardware() or AppBuilder fails → enter_safe_shutdown() →</text>
<text x="660" y="532" class="n">trace_safe_shutdown_guard(TraceId) + ArtisanFormatter ERR 99 →</text>
<text x="660" y="550" class="n">Peripherals::steal() GPIO8 → loop: feed_hw_watchdog() + blink 3×200ms + 1s pause</text>
<text x="660" y="568" class="n">By then all app tasks dead, steal is final owner (see main.rs:70-95).</text>
<text x="660" y="586" class="w">This is why init failure is observable, not a 2.2s WDT boot-loop.</text>

<!-- Component choice -->
<rect x="40" y="630" width="1120" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="60" y="652" class="t">Component Choice &amp; Procurement</text>
<text x="60" y="672" class="n">LED: 5mm diffused red (Vf 2.0V) is most visible. Green also ok. Avoid blue/white with 330Ω (dim) — use 150Ω if white.</text>
<text x="60" y="690" class="n">Resistor: 330Ω 0.125W carbon/metal film, ±5%. Power = I²R = (4mA)²×330 ≈ 5mW ≪ 125mW.</text>
<text x="60" y="708" class="n">Test: DMM GPIO8: Idle 0V, Heating 3.3V, Preheating toggles 0/3.3V @1Hz, Error @4Hz. Verify with hil example or STATUS watch.</text>
<text x="60" y="726" class="n">Ref: src/hardware/status_led.rs + src/hardware/init.rs:224 (Output::new HIGH) + src/application/tasks.rs control loop tick.</text>

<text x="600" y="940" text-anchor="middle" class="n" font-size="10">LibreRoaster · Status LED Detail · CC BY-SA · printable 1200×950 · v0.1</text>
</svg>